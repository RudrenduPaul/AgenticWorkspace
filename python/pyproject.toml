[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenticworkspace-cli"
version = "0.1.1"
description = "CLI that converts any repo into an agent-ready workspace: detects your stack, scaffolds progressive context and session handoffs, installs a real Claude Code adapter. Extensible plugin architecture for memory backends and coding-agent adapters."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
  { name = "Rudrendu Paul" },
  { name = "Sourav Nandy" },
]
keywords = ["cli", "ai-agents", "claude-code", "agent-workspace", "developer-tools", "context-management", "session-handoff", "devex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.0,<9",
  "build>=1.0,<2",
  "twine>=5.0,<7",
]

[project.urls]
Homepage = "https://github.com/RudrenduPaul/AgenticWorkspace"
Repository = "https://github.com/RudrenduPaul/AgenticWorkspace"
"Bug Tracker" = "https://github.com/RudrenduPaul/AgenticWorkspace/issues"
Changelog = "https://github.com/RudrenduPaul/AgenticWorkspace/blob/main/CHANGELOG.md"
Documentation = "https://github.com/RudrenduPaul/AgenticWorkspace/blob/main/docs/getting-started.md"
"Author - Rudrendu Paul" = "https://github.com/RudrenduPaul"
"Author - Sourav Nandy" = "https://github.com/Sourav-nandy-ai"

[project.scripts]
agenticworkspace = "agenticworkspace.cli:main"
agenticworkspace-cli = "agenticworkspace.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticworkspace"]

[tool.hatch.build.targets.sdist]
include = [
  "src/agenticworkspace",
  "tests",
  "README.md",
  "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
